version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: certiflow
      POSTGRES_USER: certiflow
      POSTGRES_PASSWORD: certiflow123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow -d certiflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend API ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://certiflow:certiflow123@postgres:5432/certiflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: certiflow-hackathon-secret-key-2026
      WHATSAPP_API_URL: http://whatsapp-mock:3001/api/send
      NODE_ENV: production

  # ── WhatsApp Mock Server ────────────────────────────────────────
  whatsapp-mock:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp-mock
    restart: unless-stopped
    ports:
      - "3001:3001"

  # ── Frontend (Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── Database Seed (run once) ────────────────────────────────────
  seed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://certiflow:certiflow123@postgres:5432/certiflow
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    restart: "no"

volumes:
  pgdata:
